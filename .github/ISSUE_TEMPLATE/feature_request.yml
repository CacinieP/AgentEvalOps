name: ✨ 功能提案
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你想解决什么问题？在没有这个功能时你如何应对？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述你期望的行为或界面
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我已搜索现有 issue，确认没有重复提案
          required: true
        - label: 该功能与 AgentEvalOps 的定位一致（Agent 评估运维，而非通用 LLM 工具）
          required: true
